<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do list</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
<main class="app">
  <header>
    <h1>To-Do List</h1>
    <button id="themeToggle" type="button" aria-label="Switch theme"></button>
  </header>

  <label for="todoInput">What would you like to get done?</label>
  <form id="todoForm">
    <input id="todoInput" type="text" placeholder="New task..." maxlength="300" required aria-describedby="taskStatus">
    <button type="submit">Add</button>
  </form>

  <p id="taskStatus" role="status"></p>
  <p id="taskCount" aria-live="polite"></p>
  <p id="emptyState">A clear list. Add your first task above.</p>
  <ul id="todoList"></ul>
</main>

    
    <script src="script.js"></script>
</body>
</html>
